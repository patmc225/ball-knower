<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/ballknower.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Ball Knower</title>
    <script>
      // Handle SPA routing - preserve the URL path for React Router
      // Store the current path before the app loads so React Router can use it
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // If we have a path that's not the root, store it for React Router
        if (path && path !== '/' && !path.includes('.')) {
          // Store the intended path so React Router can navigate to it
          window.__SPA_REDIRECT__ = path + search + hash;
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      CRA will inject your JS bundles here during build:
      <script src="/static/js/main.abc123.js"></script>
    -->
  </body>
</html>
